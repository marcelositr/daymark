name: Feature request
description: Suggest a focused improvement that fits Daymark's product principles.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Daymark is intentionally a minimal, local-first Bullet Journal rather than a generic productivity suite.

        Proposals are strongest when they preserve deliberate reflection, avoid gamification, and solve a clear journaling problem without adding unnecessary attention or complexity.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user problem or friction before describing the solution.
      placeholder: What is difficult, missing, or unnecessarily repetitive today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change that would solve the problem.
      placeholder: Explain the behavior you would like Daymark to provide.
    validations:
      required: true

  - type: textarea
    id: method-fit
    attributes:
      label: Bullet Journal / digital-minimalism fit
      description: Explain how the proposal fits Daymark's deliberate, low-distraction journal model.
      placeholder: How does this preserve reflection and avoid becoming a generic planner, dashboard, or engagement feature?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention a simpler workflow or existing Daymark feature you considered first.

  - type: dropdown
    id: platform
    attributes:
      label: Platform relevance
      options:
        - Linux and Android
        - Linux
        - Android
        - Platform-independent
    validations:
      required: true

  - type: checkboxes
    id: principles
    attributes:
      label: Product-principle acknowledgement
      options:
        - label: I understand Daymark prioritizes local-first operation, digital minimalism, deliberate reflection, and no gamification or productivity scoring.
          required: true
