name: Bug report
description: Report a reproducible problem in Daymark.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Daymark.

        **Do not include your master password, journal contents, encrypted backup files, plaintext exports, recovery material, or other sensitive/personal information.**

        For security vulnerabilities, do not use this public form. Use the Security vulnerability option in the issue chooser.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did the problem happen?
      options:
        - Linux
        - Android
        - Both
    validations:
      required: true

  - type: input
    id: daymark-version
    attributes:
      label: Daymark version
      description: Copy the version shown in About.
      placeholder: 1.0.0-alpha.2+2
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: Operating system / device
      description: For example Debian 13, Android 14, or the device model when relevant.
      placeholder: Debian 13 / Android 14 / device model
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly, without including journal or credential data.
      placeholder: Tell us what Daymark did and where you noticed it.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic/example content only. Never paste real journal entries or credentials.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or logs
      description: Optional. Remove secrets, journal content, file contents, paths containing personal information, and other sensitive data before posting.
      render: shell

  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive-data check
      options:
        - label: I have not included passwords, journal content, backup/export files, keys, recovery material, or other sensitive/personal data.
          required: true
