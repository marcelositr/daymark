name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

  quality:
    name: quality
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Validate user Wiki
        run: python3 tool/validate_wiki.py

  linux-build:
    name: linux-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev desktop-file-utils appstream

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release bundle
        run: flutter build linux --release --no-pub

      - name: Download verified appimagetool
        run: |
          curl --fail --location --output build/appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  build/appimagetool-x86_64.AppImage" | sha256sum --check --strict
          chmod 0755 build/appimagetool-x86_64.AppImage
          curl --fail --location --output build/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  build/runtime-x86_64" | sha256sum --check --strict

      - name: Package and validate Linux distributions
        run: tool/package_linux.sh build/appimagetool-x86_64.AppImage build/runtime-x86_64

      - name: Upload Linux distribution candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daymark-linux-x64
          path: |
            build/distributables/*.deb
            build/distributables/*.AppImage
          if-no-files-found: error

  android-build:
    name: android-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Android launcher icons
        run: dart run icons_launcher:create

      - name: Reject stale Android launcher icons
        run: git diff --exit-code -- android/app/src/main/res/mipmap-*

      - name: Configure disposable Android release signing
        run: |
          CI_KEYSTORE="$RUNNER_TEMP/daymark-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$CI_KEYSTORE" \
            -storepass daymark-ci-only \
            -keypass daymark-ci-only \
            -alias daymark-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Daymark CI"
          cat > android/key.properties <<EOF
          storeFile=$CI_KEYSTORE
          storePassword=daymark-ci-only
          keyAlias=daymark-ci
          keyPassword=daymark-ci-only
          EOF

      - name: Build Android release APK
        run: flutter build apk --release

  ios-build:
    name: ios-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Generate iOS platform project
        run: flutter create --platforms=ios --project-name daymark .

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Generate iOS launcher icons
        run: dart run icons_launcher:create

      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos"
          test -d "$APP_DIR/Runner.app"
          mkdir -p "$APP_DIR/Payload"
          cp -R "$APP_DIR/Runner.app" "$APP_DIR/Payload/"
          (cd "$APP_DIR" && zip -qq -r daymark-ios-beta.ipa Payload)
          mkdir -p build/distributables
          mv "$APP_DIR/daymark-ios-beta.ipa" build/distributables/daymark-ios-beta.ipa

      - name: Upload iOS distribution candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: daymark-ios-beta
          path: build/distributables/daymark-ios-beta.ipa
          if-no-files-found: error

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low

  merge-gate:
    name: merge-gate
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - quality
      - linux-build
      - android-build
      - dependency-review
      - ios-build
    runs-on: ubuntu-24.04
    steps:
      - name: Require all merge checks
        env:
          QUALITY: ${{ needs.quality.result }}
          LINUX_BUILD: ${{ needs.linux-build.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          IOS_BUILD: ${{ needs.ios-build.result }}
        run: |
          test "$QUALITY" = success
          test "$LINUX_BUILD" = success
          test "$ANDROID_BUILD" = success
          test "$DEPENDENCY_REVIEW" = success
          test "$IOS_BUILD" = success
