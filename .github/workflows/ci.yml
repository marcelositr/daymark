name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-check:
    name: dev-check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Align Tracker documentation and export coverage
        run: python3 tool/align_tracker_pr.py

      - name: Commit alignment and restore CI
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          rm tool/align_tracker_pr.py
          git config user.name "Marcelo Trindade"
          git config user.email "49993899+marcelositr@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            CHANGELOG.md PROJECT.md \
            docs/PRODUCT.md docs/DOMAIN.md docs/DATA_MODEL.md \
            docs/OPEN_EXPORT_FORMAT.md docs/TRACKERS.md \
            test/export/open_export_service_test.dart \
            tool/align_tracker_pr.py
          git commit -m "docs: define Tracker adaptation and schema v2 boundary"
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  quality:
    name: quality
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Verify Drift migration snapshot
        run: dart run drift_dev make-migrations

      - name: Reject stale Drift generated artifacts
        run: git diff --exit-code -- lib/core/database/daymark_database.g.dart drift_schemas

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  linux-build:
    name: linux-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Linux debug bundle
        run: flutter build linux --debug

  android-build:
    name: android-build
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build Android debug APK
        run: flutter build apk --debug

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: low

  merge-gate:
    name: merge-gate
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - quality
      - linux-build
      - android-build
      - dependency-review
    runs-on: ubuntu-24.04
    steps:
      - name: Require all merge checks
        env:
          QUALITY: ${{ needs.quality.result }}
          LINUX_BUILD: ${{ needs.linux-build.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        run: |
          test "$QUALITY" = success
          test "$LINUX_BUILD" = success
          test "$ANDROID_BUILD" = success
          test "$DEPENDENCY_REVIEW" = success
