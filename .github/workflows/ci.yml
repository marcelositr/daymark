name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dev-check:
    name: dev-check
    if: github.event.pull_request.draft
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format Open Export v2 test
        run: dart format test/export/open_export_service_test.dart

      - name: Commit formatter output and restore CI
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          git config user.name "Marcelo Trindade"
          git config user.email "49993899+marcelositr@users.noreply.github.com"
          git add .github/workflows/ci.yml test/export/open_export_service_test.dart
          git commit -m "test(export): format Tracker export coverage"
          git push origin HEAD:${{ github.head_ref }}
