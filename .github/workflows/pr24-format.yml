name: PR 24 formatter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr24-format.yml'
      - 'lib/features/journal/presentation/monthly_screen.dart'
      - 'test/session/monthly_history_session_test.dart'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/monthly-history'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/monthly-history
          fetch-depth: 0
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format and publish
        run: |
          set -euo pipefail
          dart format lib/features/journal/presentation/monthly_screen.dart test/session/monthly_history_session_test.dart
          git diff --check
          git rm .github/workflows/pr24-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/journal/presentation/monthly_screen.dart test/session/monthly_history_session_test.dart
          git commit -m 'fix(journal): format monthly history'
          git push origin HEAD:feat/monthly-history
