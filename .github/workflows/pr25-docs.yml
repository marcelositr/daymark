name: PR 25 docs finalizer

on:
  push:
    branches:
      - feat/basic-search

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/basic-search
          fetch-depth: 0
      - name: Apply exact documentation patch
        run: python3 tool/apply_pr25_docs.py
      - name: Publish docs and remove finalizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr25-docs.yml tool/apply_pr25_docs.py
          git add docs/PRODUCT.md docs/DOMAIN.md docs/ARCHITECTURE.md CHANGELOG.md
          git diff --check
          git commit -m "docs: align Search contracts"
          git push origin HEAD:feat/basic-search
