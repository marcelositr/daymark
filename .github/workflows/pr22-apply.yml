name: PR 22 patch

on:
  push:
    branches:
      - feat/collection-references

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: retry PR22 preserving task diagnostics' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/collection-references
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Apply patch and mechanical checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/apply_pr22_patch.py')
          text = path.read_text()
          open_marker = "    r'''import 'package:daymark/core/database/daymark_database.dart';"
          close_marker = "''',\n)\n\nreplace_once(\n    \"lib/core/session/journal_session.dart\","
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('Could not locate CollectionRepository wrapper markers.')
          text = text.replace(
              open_marker,
              '    r"""import \'package:daymark/core/database/daymark_database.dart\';',
              1,
          )
          text = text.replace(
              close_marker,
              '""",\n)\n\nreplace_once(\n    "lib/core/session/journal_session.dart",',
              1,
          )
          text = text.replace(
              '"  Future<void> _applyEntryAction(\\n",',
              '"  Future<void> _applyEntryAction",',
          )
          path.write_text(text)
          PY
          python3 -m py_compile tool/apply_pr22_patch.py
          python3 tool/apply_pr22_patch.py
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/features/journal/presentation/today_screen.dart': (
                  "      _reportUnexpectedJournalError('entry action', error, stackTrace);",
                  """      _reportUnexpectedJournalError(
        action == _EntryAction.reference
            ? 'collection reference'
            : 'task action',
        error,
        stackTrace,
      );""",
              ),
              'lib/features/journal/presentation/monthly_screen.dart': (
                  "      _reportUnexpectedMonthlyError('entry action', error, stackTrace);",
                  """      _reportUnexpectedMonthlyError(
        action == _MonthlyEntryAction.reference
            ? 'collection reference'
            : 'task action',
        error,
        stackTrace,
      );""",
              ),
              'lib/features/journal/presentation/future_screen.dart': (
                  "      _reportUnexpectedFutureError('entry action', error, stackTrace);",
                  """      _reportUnexpectedFutureError(
        action == _FutureEntryAction.reference
            ? 'collection reference'
            : 'task action',
        error,
        stackTrace,
      );""",
              ),
          }
          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{file_name}: expected one diagnostic call')
              path.write_text(text.replace(old, new, 1))
          PY
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          git diff --check

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter analyze

      - name: Test Today failure diagnostic regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test test/journal/today_screen_test.dart

      - name: Test collection repository
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test test/journal/collection_repository_test.dart

      - name: Test collection reference session
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test test/session/collection_reference_session_test.dart

      - name: Test collection reference screens
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test test/journal/entry_collection_reference_screen_test.dart

      - name: Test Collection presentation regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s flutter test \
            test/journal/collections_screen_test.dart \
            test/journal/collections_activation_test.dart

      - name: Test full suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s flutter test

      - name: Commit exact validated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/session/journal_session.dart \
            lib/features/journal/data/collection_repository.dart \
            lib/features/journal/presentation/entry_collection_reference_dialog.dart \
            lib/features/journal/presentation/today_screen.dart \
            lib/features/journal/presentation/monthly_screen.dart \
            lib/features/journal/presentation/future_screen.dart \
            lib/features/journal/presentation/collections_screen.dart \
            lib/l10n/app_en.arb \
            lib/l10n/app_pt.arb \
            lib/l10n/app_pt_BR.arb \
            test/journal/collection_repository_test.dart \
            test/journal/collections_screen_test.dart \
            test/journal/collections_activation_test.dart \
            test/journal/entry_collection_reference_screen_test.dart \
            test/session/collection_reference_session_test.dart
          git commit -m 'feat(journal): wire collection references'
          git push origin HEAD:feat/collection-references
