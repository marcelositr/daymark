name: Bootstrap Flutter scaffold

on:
  push:
    branches:
      - chore/flutter-scaffold
  workflow_dispatch:

concurrency:
  group: bootstrap-flutter-scaffold-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out working branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Generate official platform scaffolding
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          flutter create \
            --platforms=android,linux \
            --org io.github.marcelositr \
            --project-name daymark \
            "$tmp_dir/daymark"

          rm -rf android linux .metadata
          cp -a "$tmp_dir/daymark/android" ./android
          cp -a "$tmp_dir/daymark/linux" ./linux
          cp "$tmp_dir/daymark/.metadata" ./.metadata
          if [ ! -f .gitignore ]; then
            cp "$tmp_dir/daymark/.gitignore" ./.gitignore
          fi

      - name: Resolve dependencies and generate localization
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n
          dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux debug bundle
        run: flutter build linux --debug

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Remove generated localization sources from commit
        shell: bash
        run: find lib/l10n -maxdepth 1 -name 'app_localizations*.dart' -delete

      - name: Commit generated scaffold and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add .gitignore .metadata android linux pubspec.lock lib test
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(scaffold): generate Flutter platform files and lock dependencies"
          git push origin HEAD:chore/flutter-scaffold
