name: PR 22 docs

on:
  push:
    branches:
      - feat/collection-references

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'docs: run PR22 documentation patch' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/collection-references
          fetch-depth: 0

      - name: Apply documentation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_pr22_docs.py
          git diff --check

      - name: Commit docs and remove temporary patch tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRODUCT.md docs/ARCHITECTURE.md PROJECT.md
          git rm tool/apply_pr22_docs.py .github/workflows/pr22-docs.yml
          git commit -m 'docs: align collection references handoff'
          git push origin HEAD:feat/collection-references
