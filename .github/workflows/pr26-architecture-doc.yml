name: PR 26 architecture doc

on:
  push:
    branches: [feat/daily-history]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/daily-history
          fetch-depth: 0

      - name: Apply exact architecture update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          old = """`AppShell` publishes the active top-level section through the presentation-level `AppSectionScope`. Screens that cache journal snapshots and can be changed by another section must observe reactivation and reload the affected presentation state. Cross-surface writes must become visible when the destination section is re-entered without requiring lock, application restart, or widget remount.\n\nDo not solve retained-tab freshness by destroying all branches, polling continuously, or moving journal semantics into the router. Section activation is presentation lifecycle; persistence and movement semantics remain below the UI boundary.\n"""
          new = """`AppShell` publishes the active top-level section through the presentation-level `AppSectionScope`. Screens that cache journal snapshots and can be changed by another section must observe reactivation and reload the affected presentation state. Cross-surface writes must become visible when the destination section is re-entered without requiring lock, application restart, or widget remount.\n\nHistorical Daily retrieval is contextual navigation inside the Today branch rather than another top-level destination. `/daily/:date` resolves a genuine method date through a non-creating `DailyLogRepository.find(...)` call exposed by `JournalDailyHistorySession`; a missing historical date remains absent instead of creating a Log. The historical screen is read-only, while `/` remains the interactive current Daily Log. This route gives later Index/Search navigation a real historical Daily target without moving retrieval semantics into the router.\n\nDo not solve retained-tab freshness by destroying all branches, polling continuously, or moving journal semantics into the router. Section activation is presentation lifecycle; persistence and movement semantics remain below the UI boundary.\n"""
          if text.count(old) != 1:
              raise SystemExit('architecture marker mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Publish and remove probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr26-architecture-doc.yml
          if [ -f .github/pr26-architecture-trigger ]; then
            git rm .github/pr26-architecture-trigger
          fi
          git add docs/ARCHITECTURE.md
          git commit -m "docs: describe Daily history architecture"
          git push origin HEAD:feat/daily-history
