name: PR 23 formatter

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/journal/data/index_repository.dart'
      - 'lib/features/journal/presentation/index_screen.dart'
      - 'test/journal/index_repository_test.dart'
      - 'test/journal/index_screen_test.dart'
      - '.github/workflows/pr23-format.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feat/basic-index'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/basic-index
          fetch-depth: 0
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Format PR 23 Dart files
        run: |
          set -euo pipefail
          dart format \
            lib/features/journal/data/index_repository.dart \
            lib/features/journal/presentation/index_screen.dart \
            test/journal/index_repository_test.dart \
            test/journal/index_screen_test.dart
      - name: Publish formatter output when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            lib/features/journal/data/index_repository.dart \
            lib/features/journal/presentation/index_screen.dart \
            test/journal/index_repository_test.dart \
            test/journal/index_screen_test.dart; then
            echo 'Formatter already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/journal/data/index_repository.dart \
            lib/features/journal/presentation/index_screen.dart \
            test/journal/index_repository_test.dart \
            test/journal/index_screen_test.dart
          git commit -m 'fix(journal): format basic index implementation'
          git push origin HEAD:feat/basic-index
