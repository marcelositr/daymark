name: PR 21 patch

on:
  push:
    branches:
      - feat/task-migration-collections

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply PR 21 patch in pinned toolchain' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/task-migration-collections
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_pr21_patch.py
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          dart format lib test
          git diff --check
          flutter analyze
          flutter test

      - name: Commit exact validated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/session/journal_session.dart \
            lib/presentation/app_section_scope.dart \
            lib/features/journal/presentation/task_collection_migration_dialog.dart \
            lib/features/journal/presentation/today_screen.dart \
            lib/features/journal/presentation/monthly_screen.dart \
            lib/features/journal/presentation/collections_screen.dart \
            lib/l10n/app_en.arb \
            lib/l10n/app_pt.arb \
            lib/l10n/app_pt_BR.arb \
            test/session/collection_migration_session_test.dart \
            test/journal/task_collection_migration_screen_test.dart \
            test/journal/collections_activation_test.dart
          git commit -m 'feat(journal): wire task migration to collections'
          git push origin HEAD:feat/task-migration-collections
