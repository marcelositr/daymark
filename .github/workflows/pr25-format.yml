name: PR 25 formatter

on:
  push:
    branches:
      - feat/basic-search

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/basic-search
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Format PR 25 Dart files
        run: |
          dart format \
            lib/features/journal/data/search_repository.dart \
            lib/features/journal/presentation/search_screen.dart \
            test/journal/search_activation_test.dart \
            test/journal/search_repository_test.dart \
            test/journal/search_screen_test.dart
      - name: Publish formatted files and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr25-format.yml
          git add \
            lib/features/journal/data/search_repository.dart \
            lib/features/journal/presentation/search_screen.dart \
            test/journal/search_activation_test.dart \
            test/journal/search_repository_test.dart \
            test/journal/search_screen_test.dart
          git commit -m "chore: format PR25 with pinned Dart"
          git push origin HEAD:feat/basic-search
