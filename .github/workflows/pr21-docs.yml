name: PR 21 docs

on:
  push:
    branches:
      - feat/task-migration-collections

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'docs: apply PR 21 handoff updates' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/task-migration-collections
          fetch-depth: 0

      - name: Apply documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/apply_pr21_docs.py
          git diff --check

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT.md docs/PRODUCT.md docs/DOMAIN.md docs/ARCHITECTURE.md
          git commit -m 'docs: align task migration to collections'
          git push origin HEAD:feat/task-migration-collections
