name: Monthly Format Probe

on:
  push:
    branches:
      - feat/monthly-log

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show exact formatter diff
        run: |
          dart format lib/features/journal/data/monthly_log_repository.dart lib/features/journal/presentation/monthly_screen.dart test/journal/monthly_log_repository_test.dart
          git diff -- lib/features/journal/data/monthly_log_repository.dart lib/features/journal/presentation/monthly_screen.dart test/journal/monthly_log_repository_test.dart
