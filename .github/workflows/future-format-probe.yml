name: Future Format Probe

on:
  push:
    branches:
      - feat/future-log

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Print formatter diff
        run: |
          dart format \
            lib/features/journal/presentation/future_screen.dart \
            test/journal/future_log_repository_test.dart \
            test/journal/future_screen_test.dart \
            test/session/future_log_session_test.dart
          git diff -- \
            lib/features/journal/presentation/future_screen.dart \
            test/journal/future_log_repository_test.dart \
            test/journal/future_screen_test.dart \
            test/session/future_log_session_test.dart
