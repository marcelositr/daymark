name: PR 26 full validation

on:
  push:
    branches: [feat/daily-history]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/daily-history
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Generate Drift sources
        run: dart run build_runner build

      - name: Focused Daily history tests
        run: |
          flutter test \
            test/journal/daily_log_repository_test.dart \
            test/journal/daily_history_screen_test.dart \
            test/session/daily_history_session_test.dart

      - name: Full test suite
        run: flutter test

      - name: Remove validation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr26-full-validation.yml
          git commit -m "ci: remove PR26 full validation"
          git push origin HEAD:feat/daily-history
