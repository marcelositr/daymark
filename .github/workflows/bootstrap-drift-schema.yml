name: Bootstrap Drift schema

on:
  push:
    branches:
      - feat/data-schema
  workflow_dispatch:

concurrency:
  group: bootstrap-drift-schema-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out schema branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: feat/data-schema

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate migration schema v1
        run: dart run drift_dev make-migrations

      - name: Format generated and handwritten Dart
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit generated schema artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add lib/core/database drift_schemas test/database build.yaml
          if git diff --cached --quiet; then
            echo "No generated schema changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): generate Drift schema v1 artifacts"
          git push origin HEAD:feat/data-schema
